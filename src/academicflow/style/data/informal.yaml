# Informal or imprecise expression -> suggested academic alternative.
# Suggestions are prompts for review, not automatic replacements.
"a lot of": "many / much"
"lots of": "many / much"
"a bunch of": "several / numerous"
"get": "obtain / receive / become (choose by context)"
"got": "obtained / received / became (choose by context)"
"gets": "obtains / receives / becomes (choose by context)"
"getting": "obtaining / receiving (choose by context)"
"big": "large / substantial"
"huge": "substantial / considerable"
"small": "limited / minor (choose by context)"
"stuff": "materials / factors / components (choose by context)"
"things": "factors / elements / components (choose by context)"
"thing": "factor / element / component (choose by context)"
"kind of": "somewhat / approximately (choose by context)"
"sort of": "somewhat / approximately (choose by context)"
"pretty": "considerably / relatively (choose by context)"
"basically": "remove or state the underlying principle precisely"
"a little": "slightly / marginally (choose by context)"
"pretty much": "approximately / largely (choose by context)"
"tons of": "many / substantial quantities of"
"loads of": "many / substantial quantities of"
"kids": "children / participants (choose by context)"
"guys": "individuals / participants"
"okay": "acceptable / adequate (choose by context)"
"ok": "acceptable / adequate (choose by context)"
"awesome": "effective / notable (choose by context)"
"cool": "use a specific evaluative description"
"weird": "unexpected / anomalous"
"bad": "unfavourable / inadequate (choose by context)"
"good": "effective / favourable (choose by context)"
"nice": "use a specific evaluative description"
"stuff like that": "similar factors / related examples"
"and so on": "provide the relevant examples or use 'etc.' sparingly"
"you can see": "the results indicate / show"
"I think": "the evidence suggests (when supported)"
"I guess": "the evidence suggests (when supported)"
"in a way": "specify the relevant respect"
"at the end of the day": "ultimately / in conclusion"
"to be honest": "remove this phrase"
"in today's world": "in the current context (specify the context)"
"a big deal": "a substantial issue / an important factor"
"pretty good": "effective / satisfactory (choose by context)"
"not bad": "adequate / favourable (choose by context)"
"sorta": "somewhat"
"kinda": "somewhat"
"wanna": "want to"
"gonna": "going to"
"gotta": "must / have to"
"due to the fact that": "because"
"at this point in time": "currently / at present"
"in order to": "to"
"for the purpose of": "for"
"has the ability to": "can"
"make use of": "use"
"find out": "determine"
"look at": "examine / investigate"
"come up with": "develop / propose"
"deal with": "address / examine"
"super": "highly / particularly (choose by context)"
"totally": "entirely (when factually accurate)"
"a ton of": "many / a substantial amount of"
"kind of thing": "type of factor / phenomenon"
"sort of thing": "type of factor / phenomenon"
