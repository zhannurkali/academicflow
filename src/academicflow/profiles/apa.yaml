# Practical APA-inspired defaults. These are editable heuristics, not a full APA manual.
name: apa
citation_style: apa
allow_first_person: true
allow_contractions: false
max_sentence_words: 40
abstract_max_words: 250
section_rules:
  abstract:
    max_words: 250
    forbid_citations: true
  methods:
    tense: past
  results:
    tense: past
  conclusion:
    forbid_citations: false
preferred_spelling: us
disabled_rules: []
