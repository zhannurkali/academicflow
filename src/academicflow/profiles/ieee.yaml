# Practical IEEE-inspired defaults. Adjust to the target journal/conference instructions.
name: ieee
citation_style: ieee
allow_first_person: true
allow_contractions: false
max_sentence_words: 35
abstract_max_words: 250
section_rules:
  abstract:
    max_words: 250
    forbid_citations: true
  methods:
    tense: past
  results:
    tense: past
  conclusion:
    forbid_citations: false
preferred_spelling: us
disabled_rules: []
