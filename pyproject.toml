[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "academicflow"
dynamic = ["version"]
description = "An academic-writing pipeline for Jupyter: text analysis, style checks, BibTeX citations (APA/IEEE/Nature), abstract generation, and LaTeX/Word export."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# TODO(member 5): replace with the five members' real names
authors = [
    { name = "Member 1" },
    { name = "Member 2" },
    { name = "Member 3" },
    { name = "Member 4" },
    { name = "Member 5" },
]
keywords = ["jupyter", "academic-writing", "latex", "bibtex", "citations", "nlp", "readability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Jupyter",
    "Framework :: IPython",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
# Base dependencies: lower bounds only, no upper pins (avoids conflicts on JupyterHub).
dependencies = [
    "pybtex>=0.24",
    "pyyaml>=5.4",
    "ipython>=7.0",
    "nbformat>=5.0",
    "numpy>=1.21",
    "pypandoc_binary>=1.11",
    "python-docx>=0.8.11",
]

[project.optional-dependencies]
nlp = ["spacy>=3.5"]
llm = ["openai>=1.0"]
dev = ["pytest>=7", "ruff>=0.4", "build>=1.0", "twine>=4", "mkdocs-material>=9"]
all = ["academicflow[nlp,llm]"]

[project.urls]
Homepage = "https://github.com/zhannurkali/academicflow"
Documentation = "https://zhannurkali.github.io/academicflow/"
Source = "https://github.com/zhannurkali/academicflow"
Issues = "https://github.com/zhannurkali/academicflow/issues"

[tool.hatch.version]
path = "src/academicflow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/academicflow"]

[tool.hatch.build.targets.sdist]
include = ["src/academicflow", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Example notebooks contain long sample paragraphs on purpose.
"*.ipynb" = ["E501"]
